[package]
name = "distro-shop"
version = "1.1.3"
authors = ["TechCore3"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
dirs = "7.0.0"
image = "0.25.10"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["user"] }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process"] }
wmi = "0.13" #thank god i dont have to work with win32 directly
runas = "1.2"
is_elevated = "0.1"
sha2 = "0.11.0"
zbus = { version = "6.0.0", features = ["tokio"] }


[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[patch.crates-io]
dioxus-desktop = { path = "vendor/dioxus-desktop" }
