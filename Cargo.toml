[package]
name = "distro-shop"
version = "1.1.3"
authors = ["TechCore3"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
dirs = "7.0.0"
image = "0.25.10"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["user"] }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process"] }
wmi = "0.13" #thank god i dont have to work with win32 directly
runas = "1.2"
is_elevated = "0.1"
sha2 = "0.11.0"
zbus = { version = "6.0.0", features = ["tokio"] }


[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[patch.crates-io]
dioxus-desktop = { path = "vendor/dioxus-desktop" }

[package.metadata.deb]
depends = "$auto"
assets = [
  ["target/release/distro-shop", "usr/bin/", "755"],
  ["packaging/distro-shop.desktop", "usr/share/applications/", "644"],
  ["packaging/distro-shop.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/distro-shop", dest = "/usr/bin/distro-shop", mode = "755" },
  { source = "packaging/distro-shop.desktop", dest = "/usr/share/applications/distro-shop.desktop", mode = "644" },
  { source = "packaging/distro-shop.png", dest = "/usr/share/icons/hicolor/256x256/apps/distro-shop.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
webkit2gtk4_1 = "*"
gtk3 = "*"