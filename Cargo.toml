[package]
name = "distro-shop"
version = "0.1.0"
authors = ["TechCore3"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
dirs = "7.0.0"
image = "0.25.10"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["user"] }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.1"
wmi = "0.13" #thank god i dont have to work with win32 directly
runas = "1.2"
is_elevated = "0.1"
sha2 = "0.11.0"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
