app-id: io.github.TechCore3.Distroshop
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: distro-shop

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/distro-shop/cargo
    LIBRARY_PATH: /app/lib
  build-args:
    - --share=network

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --device=input
  - --device=kvm
  - --filesystem=home
  - --system-talk-name=org.freedesktop.UDisks2
  - --socket=pulseaudio   

modules:
  - name: libslirp
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/slirp/libslirp.git
        tag: v4.9.5

  - name: qemu
    buildsystem: simple
    build-commands:
      - >-
        ./configure
        --prefix=/app
        --target-list=x86_64-softmmu
        --enable-kvm
        --enable-gtk
        --enable-slirp
        --disable-docs
        --disable-user
        --disable-werror
        --disable-download
      - make -j$(nproc)
      - make install
    sources:
      - type: archive
        url: https://download.qemu.org/qemu-11.1.2.tar.xz
        sha256: 731b5681e4bb18be313231579b8efd0296c5b015fa36dc533874b639ba838016

  - name: xdotool
    buildsystem: simple
    build-commands:
      - make
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/jordansissel/xdotool.git
        tag: v3.20211022.1

  - name: distro-shop
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/distro-shop /app/bin/distro-shop
    sources:
      - type: dir
        path: .