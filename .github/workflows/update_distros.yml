name: update-distros

on:
  schedule:
    - cron: "0 4 1 * *"   # 1st of each month, 04:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Distro to update, or all"
        type: choice
        default: all
        options:
          - all
          - arch linux
          - tiny core linux
          - linux mint
          - ubuntu
          - debian
          - fedora workstation
          - opensuse leap
          - kali linux
          - alpine linux
          - nixos
      dry_run:
        description: "Report changes without writing distros.json"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the script uses str | None hints, so 3.10+

      - name: Pin newest releases
        id: update
        continue-on-error: true    # still open the PR with the distros that worked
        env:
          TARGET: ${{ inputs.target || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=("$TARGET" assets/distros.json)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 .github/scripts/update_distro.py "${args[@]}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-distros
          commit-message: Update distro releases and hashes
          title: Update distro releases and hashes
          body: |
            Automated update from update_distro.py.
            Review each version change and hash before merging.
          add-paths: assets/distros.json

      - name: Fail the run if any distro failed
        if: steps.update.outcome == 'failure'
        run: exit 1