name: Build packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BIN_NAME: distro-shop

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            file desktop-file-utils patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Build
        run: cargo build --release

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build .deb
        run: cargo deb --no-build --no-strip

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          DEPLOY_GTK_VERSION: 3
          LD_ARCH: ${{ matrix.arch }}
        run: |
          LD_URL=https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2
          curl -fsSL -o linuxdeploy "$LD_URL/linuxdeploy-${LD_ARCH}.AppImage"
          curl -fsSL -o linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh

          export OUTPUT="${BIN_NAME}-${LD_ARCH}.AppImage"
          ./linuxdeploy --appdir AppDir \
            --executable target/release/${BIN_NAME} \
            --desktop-file packaging/${BIN_NAME}.desktop \
            --icon-file packaging/${BIN_NAME}.png \
            --plugin gtk \
            --output appimage

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          cp ${BIN_NAME}-${{ matrix.arch }}.AppImage dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(gh release view --json tagName -q .tagName)
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" dist/* --clobber