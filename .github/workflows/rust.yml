name: Build and bundle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DX_VERSION: 0.7.1

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-apple-silicon
          - os: macos-15-intel
            name: macos-intel

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2t64 rpm

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm $RUNNER_TEMP/cert.p12

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Dioxus CLI
        shell: bash
        run: cargo binstall -y dioxus-cli@${{ env.DX_VERSION }}

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dx bundle --platform desktop --release \
            --package-types deb \
            --package-types rpm \
            --package-types appimage

      - name: Bundle (macOS, signed)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          dx bundle --platform desktop --release \
            --package-types macos \
            --codesign true \
            --apple-team-id "$SIGN_IDENTITY"

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dx bundle --platform desktop --release \
            --package-types nsis \
            --package-types msi

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          # Installers and packages
          find target/dx -type f \( \
            -name "*.msi" -o -name "*-setup.exe" -o -name "*.exe" -o \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} dist/ \;
          # macOS .app bundles are directories, zip them with ditto to keep the signature intact
          find target/dx -type d -name "*.app" -prune | while read -r app; do
            ditto -c -k --keepParent "$app" "dist/$(basename "$app").zip"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error